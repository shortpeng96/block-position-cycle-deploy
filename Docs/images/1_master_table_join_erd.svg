<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="240" viewBox="0 0 1500 240" role="img" aria-labelledby="title desc">
  <title id="title">Master Table ERD</title>
  <desc id="desc">Block, DDQN Result, Position, Initial tables joined with Crow's Foot cardinality notation.</desc>
  <style>
    text { font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #111; }
    .title { font-size: 25px; font-weight: 600; }
    .table { fill: #fff; stroke: #222; stroke-width: 1.5; }
    .divider, .relation, .mark { fill: none; stroke: #222; stroke-width: 1.7; }
    .name { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .field { font-size: 15px; }
    .key { font-size: 13px; font-weight: 600; }
  </style>

  <rect width="1500" height="240" fill="#fff"/>
  <text x="40" y="38" class="title">Master Table ERD</text>

  <!-- BLOCK -->
  <rect x="40" y="70" width="250" height="150" class="table"/>
  <line x1="40" y1="112" x2="290" y2="112" class="divider"/>
  <text x="165" y="97" class="name">BLOCK</text>
  <text x="60" y="148" class="key">PK</text>
  <text x="95" y="148" class="field">index</text>

  <!-- DDQN RESULT -->
  <rect x="400" y="70" width="290" height="150" class="table"/>
  <line x1="400" y1="112" x2="690" y2="112" class="divider"/>
  <text x="545" y="97" class="name">DDQN RESULT</text>
  <text x="420" y="148" class="key">FK</text>
  <text x="455" y="148" class="field">block sequence no.</text>
  <text x="420" y="181" class="key">FK</text>
  <text x="455" y="181" class="field">block position id</text>

  <!-- POSITION -->
  <rect x="810" y="70" width="300" height="150" class="table"/>
  <line x1="810" y1="112" x2="1110" y2="112" class="divider"/>
  <text x="960" y="97" class="name">POSITION</text>
  <text x="830" y="148" class="key">PK</text>
  <text x="865" y="148" class="field">block position id</text>
  <text x="830" y="181" class="key">UK</text>
  <text x="865" y="181" class="field">block position description</text>

  <!-- INITIAL -->
  <rect x="1190" y="70" width="270" height="150" class="table"/>
  <line x1="1190" y1="112" x2="1460" y2="112" class="divider"/>
  <text x="1325" y="97" class="name">INITIAL</text>
  <text x="1210" y="148" class="key">UK</text>
  <text x="1245" y="148" class="field">block position description</text>

  <!-- BLOCK to DDQN RESULT -->
  <line x1="290" y1="145" x2="400" y2="145" class="relation"/>
  <line x1="312" y1="132" x2="312" y2="158" class="mark"/>
  <line x1="322" y1="132" x2="322" y2="158" class="mark"/>
  <line x1="368" y1="132" x2="368" y2="158" class="mark"/>
  <line x1="378" y1="132" x2="378" y2="158" class="mark"/>

  <!-- DDQN RESULT to POSITION -->
  <line x1="690" y1="145" x2="810" y2="145" class="relation"/>
  <path d="M 690 132 L 708 145 L 690 158 M 690 145 L 708 145" class="mark"/>
  <circle cx="722" cy="145" r="7" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <line x1="782" y1="132" x2="782" y2="158" class="mark"/>
  <line x1="792" y1="132" x2="792" y2="158" class="mark"/>

  <!-- POSITION to INITIAL -->
  <line x1="1110" y1="145" x2="1190" y2="145" class="relation"/>
  <line x1="1122" y1="132" x2="1122" y2="158" class="mark"/>
  <line x1="1132" y1="132" x2="1132" y2="158" class="mark"/>
  <circle cx="1160" cy="145" r="7" fill="#fff" stroke="#222" stroke-width="1.7"/>
  <line x1="1178" y1="132" x2="1178" y2="158" class="mark"/>

</svg>
